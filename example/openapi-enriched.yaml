  /api/films/{id}/planets:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: Unique numeric identifier of the film whose planets you want to retrieve. Provide this value in the request path.
          examples:
            A New Hope film ID:
              summary: The film ID for Episode IV.
              description: Use this numeric path value to retrieve the planets linked to the original Star Wars film, A New Hope.
              value: 1
            The Empire Strikes Back film ID:
              summary: The film ID for Episode V.
              description: This path value targets the second film in the original trilogy and returns its associated planets.
              value: 2
            Return of the Jedi film ID:
              summary: The film ID for Episode VI.
              description: Use this numeric identifier to list the planets connected to Return of the Jedi.
              value: 3
      responses:
        "200":
          description: Returns the Star Wars planets associated with the specified film ID, with each planet including its key details and related entity links. Use this response to see the planets that appear in or are linked to that film.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    rotation_period:
                      type: string
                    orbital_period:
                      type: string
                    diameter:
                      type: string
                    climate:
                      type: string
                    gravity:
                      type: string
                    terrain:
                      type: string
                    surface_water:
                      type: string
                    population:
                      type: string
                    residents:
                      type: array
                      items:
                        type: string
                    films:
                      type: array
                      items:
                        type: string
                    created:
                      type: string
                    edited:
                      type: string
                    url:
                      type: string
                  required:
                    - name
                    - rotation_period
                    - orbital_period
                    - diameter
                    - climate
                    - gravity
                    - terrain
                    - surface_water
                    - population
                    - residents
                    - films
                    - created
                    - edited
                    - url
              examples:
