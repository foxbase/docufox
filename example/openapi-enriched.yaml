openapi: 3.1.0
info:
  title: SWAPI - The Star Wars API
  version: 1.0.0
paths:
  /api/films/{id}/people:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: Unique numeric identifier of the film whose characters you want to list. This value must be included in the request path.
          examples:
            A New Hope film ID:
              summary: The path parameter targeting the original Star Wars film.
              description: Use the numeric film identifier for Episode IV when listing the characters associated with that movie.
              value: 1
            The Empire Strikes Back film ID:
              summary: A different film identifier in the saga.
              description: This example points to the second film in the original trilogy and would return the characters linked to that film.
              value: 2
            Return of the Jedi film ID:
              summary: Another valid numeric film identifier.
              description: A request using the identifier for Episode VI, retrieving the characters associated with that film.
              value: 3
      responses:
        "200":
          description: Returns the Star Wars characters associated with the specified film. Use this result to retrieve the people who appear in or are linked to that film.
      x-docufox-hash: b04a389c4139c7b6147976c2d81a35b3c9b97c91d23f73bcdbbb8c6beb8c503c
      summary: List characters in a film
      description: Returns the Star Wars characters associated with the specified film ID. Use this endpoint to retrieve the people who appear in or are linked to that film.
  /api/people/{id}/films:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: Unique numeric identifier of the Star Wars character whose films you want to retrieve. Include this value in the request path.
          examples:
            Luke Skywalker character ID:
              summary: A path value for Luke Skywalker's film list.
              description: Use the numeric identifier for Luke Skywalker when requesting the films associated with this Star Wars character.
              value: 1
            Darth Vader character ID:
              summary: A path value for Darth Vader's film list.
              description: This example targets Darth Vader's record and would return the films linked to that character.
              value: 4
            Leia Organa character ID:
              summary: A path value for Leia Organa's film list.
              description: Use the character identifier for Leia Organa to retrieve the Star Wars films she appears in.
              value: 5
      responses:
        "200":
          description: Returns the Star Wars films associated with the specified character, including each film’s main details such as title, episode number, synopsis, director, producer, release date, and related entities. Use this result to see the movies a character appears in or is linked to.
