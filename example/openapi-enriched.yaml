                      items:
                        type: string
                    vehicles:
                      type: array
                      items:
                        type: string
                    species:
                      type: array
                      items:
                        type: string
                    created:
                      type: string
                    edited:
                      type: string
                    url:
                      type: string
                  required:
                    - title
                    - episode_id
                    - opening_crawl
                    - director
                    - producer
                    - release_date
                    - characters
                    - planets
                    - starships
                    - vehicles
                    - species
                    - created
                    - edited
                    - url
              examples:
                Luke Skywalker Filmography:
                  summary: The films associated with Luke Skywalker.
                  description: This example returns the full set of Star Wars films linked to Luke Skywalker, including the core metadata and related entity URLs for each film.
