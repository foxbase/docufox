                    title:
                      type: string
                    episode_id:
                      type: integer
                    opening_crawl:
                      type: string
                    director:
                      type: string
                    producer:
                      type: string
                    release_date:
                      type: string
                    characters:
                      type: array
                      items:
                        type: string
                    planets:
                      type: array
