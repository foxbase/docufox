      x-docufox-hash: be86f585e177a3c25d55f6088975e04be6ab62f5bc45f8f749b4e77ff025b3e5
      summary: List all films
      description: Retrieves a list of films, optionally filtered, sorted, and paginated via query parameters where supported, and returns an array of film objects with their associated metadata (such as identifiers, titles, and release information).
  /api/planets:
    get:
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Returns an array of planet records, each providing the planet's identification along with available physical and orbital details; the array may be empty if no planets match the request. Use the returned records to display planet listings or to drive further planet-specific queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  rotation_period:
                    type: string
                  orbital_period:
                    type: string
                  diameter:
                    type: string
                  climate:
                    type: string
                  gravity:
                    type: string
                  terrain:
                    type: string
                  surface_water:
                    type: string
                  population:
                    type: string
                  residents:
                    type: array
                    items:
                      type: string
                  films:
                    type: array
                    items:
                      type: string
                  created:
                    type: string
                  edited:
                    type: string
                  url:
                    type: string
                required:
                  - name
                  - rotation_period
                  - orbital_period
                  - diameter
                  - climate
                  - gravity
                  - terrain
                  - surface_water
                  - population
                  - residents
                  - films
                  - created
                  - edited
                  - url
              examples: {}
